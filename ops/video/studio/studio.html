<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Parity — render surface</title>
    <style>
      html, body { margin: 0; background: #14110e; height: 100%; overflow: hidden; }
      #stage { display: block; width: 100vw; height: auto; max-height: 100vh; margin: 0 auto; }
    </style>
  </head>
  <body>
    <canvas id="stage" width="1920" height="1080"></canvas>
    <script type="module">
      // The render surface for the demo film.
      //
      // Deterministic by construction: every frame is a pure function of a timestamp, so the
      // encoder can step time at exactly 1/60s and the result is reproducible. Nothing here
      // animates on its own and nothing reads the wall clock.
      //
      // The product footage is real. Everything this file adds on top — the window frame, the
      // camera move, the cursor, the captions — is presentation, and the cursor says so on
      // screen the first time it appears.

      const W = 1920;
      const H = 1080;
      const cv = document.getElementById("stage");
      const ctx = cv.getContext("2d", { alpha: false });

      // The captured viewport, in CSS pixels. Camera coordinates are in this space.
      const VIEW_W = 1440;
      const VIEW_H = 900;
      const CHROME_H = 44; // browser title bar, in the same CSS space

      // Broadsheet palette, matching the product.
      const PAPER = "#F7F3EB";
      const INK = "#1A1512";
      const VERMILION = "#C83406";
      const MUTED = "#6B635C";
      const INKS = { ondo: "#F72FA7", xstocks: "#FFDC3A", backpack: "#00C5EE" };

      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const lerp = (a, b, t) => a + (b - a) * t;

      // Screen Studio's motion signature: a long, soft ease that starts and ends almost
      // imperceptibly. This is a cubic-bezier(0.33, 0, 0.1, 1) solved by bisection.
      function bezier(p1x, p1y, p2x, p2y) {
        const cx = 3 * p1x, bx = 3 * (p2x - p1x) - cx, ax = 1 - cx - bx;
        const cy = 3 * p1y, by = 3 * (p2y - p1y) - cy, ay = 1 - cy - by;
        const fx = (t) => ((ax * t + bx) * t + cx) * t;
        const fy = (t) => ((ay * t + by) * t + cy) * t;
        return (x) => {
          if (x <= 0) return 0;
          if (x >= 1) return 1;
          let lo = 0, hi = 1, t = x;
          for (let i = 0; i < 24; i++) {
            const v = fx(t);
            if (Math.abs(v - x) < 1e-5) break;
            v < x ? (lo = t) : (hi = t);
            t = (lo + hi) / 2;
          }
          return fy(t);
        };
      }
      const EASE = {
        camera: bezier(0.33, 0, 0.1, 1), // the signature push/pull
        soft: bezier(0.4, 0, 0.2, 1),
        out: bezier(0, 0, 0.2, 1),
        inOut: bezier(0.65, 0, 0.35, 1),
      };

      const images = new Map();
      let film = null;

      // ── background ───────────────────────────────────────────────────────
      let bgPattern = null;
      function buildBackground() {
        // A warm dark ground with a faint paper grain, so the bright product window reads as
        // lit rather than pasted on. Drawn once into an offscreen tile.
        const t = document.createElement("canvas");
        t.width = t.height = 160;
        const g = t.getContext("2d");
        g.fillStyle = "#17130f";
        g.fillRect(0, 0, 160, 160);
        const img = g.getImageData(0, 0, 160, 160);
        for (let i = 0; i < img.data.length; i += 4) {
          const n = (Math.random() - 0.5) * 9;
          img.data[i] += n;
          img.data[i + 1] += n;
          img.data[i + 2] += n;
        }
        g.putImageData(img, 0, 0);
        bgPattern = ctx.createPattern(t, "repeat");
      }

      function drawBackground(t) {
        ctx.fillStyle = "#17130f";
        ctx.fillRect(0, 0, W, H);
        if (bgPattern) {
          ctx.globalAlpha = 0.5;
          ctx.fillStyle = bgPattern;
          ctx.fillRect(0, 0, W, H);
          ctx.globalAlpha = 1;
        }
        // a very slow warm wash, so long holds are never completely static
        const drift = Math.sin(t * 0.06) * 60;
        const g = ctx.createRadialGradient(W / 2 + drift, H * 0.34, 80, W / 2, H * 0.5, W * 0.78);
        g.addColorStop(0, "rgba(200,52,6,0.12)");
        g.addColorStop(0.55, "rgba(120,60,30,0.05)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }

      // ── geometry ─────────────────────────────────────────────────────────
      function roundRect(c, x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + rr, y);
        c.arcTo(x + w, y, x + w, y + h, rr);
        c.arcTo(x + w, y + h, x, y + h, rr);
        c.arcTo(x, y + h, x, y, rr);
        c.arcTo(x, y, x + w, y, rr);
        c.closePath();
      }

      /**
       * Camera state -> where the window lands on the canvas.
       * `cx`/`cy` are the content point held at frame centre, in CSS viewport pixels.
       * `zoom` 1 frames the whole window with a margin.
       */
      // Scale at zoom 1: the whole window, chrome included, sitting inside the frame with a
      // real margin. This is what makes the shot read as a window on a desk rather than a
      // full-bleed screenshot — push-ins above ~1.3 then crop into it.
      const FIT = (H * 0.88) / (VIEW_H + CHROME_H);
      function layout(cam) {
        const s = FIT * cam.zoom;
        const contentW = VIEW_W * s;
        const contentH = VIEW_H * s;
        const chromeH = CHROME_H * s;
        // Once the window is big enough to cover the frame, never let the camera drift past
        // its edge — a sliver of background inside a push-in reads as a mistake.
        let { cx, cy } = cam;
        const halfW = W / 2 / s;
        const halfH = H / 2 / s;
        if (contentW >= W) cx = clamp(cx, halfW, VIEW_W - halfW);
        if (contentH >= H) cy = clamp(cy, halfH, VIEW_H - halfH);
        const cxPx = cx * s;
        const cyPx = cy * s;
        const x = W / 2 - cxPx;
        const y = H / 2 - cyPx + chromeH / 2; // keep the frame optically centred incl. chrome
        return { s, x, y, contentW, contentH, chromeH };
      }

      // ── the browser window ───────────────────────────────────────────────
      function drawWindow(shot, cam, opts = {}) {
        const L = layout(cam);
        const radius = 14 * Math.min(1.6, L.s);
        const winX = L.x;
        const winY = L.y - L.chromeH;
        const winW = L.contentW;
        const winH = L.contentH + L.chromeH;

        // layered soft shadow — one wide and faint, one tight and darker
        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.55)";
        ctx.shadowBlur = 90 * Math.min(1.4, L.s);
        ctx.shadowOffsetY = 38 * Math.min(1.4, L.s);
        ctx.fillStyle = "#0d0a08";
        roundRect(ctx, winX, winY, winW, winH, radius);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.4)";
        ctx.shadowBlur = 24 * Math.min(1.4, L.s);
        ctx.shadowOffsetY = 8 * Math.min(1.4, L.s);
        ctx.fillStyle = "#0d0a08";
        roundRect(ctx, winX, winY, winW, winH, radius);
        ctx.fill();
        ctx.restore();

        // clip everything to the window
        ctx.save();
        roundRect(ctx, winX, winY, winW, winH, radius);
        ctx.clip();

        // title bar
        ctx.fillStyle = "#E7E0D4";
        ctx.fillRect(winX, winY, winW, L.chromeH);
        ctx.fillStyle = "rgba(26,21,18,0.14)";
        ctx.fillRect(winX, winY + L.chromeH - Math.max(1, L.s), winW, Math.max(1, L.s));

        const dot = 6 * L.s;
        const dy = winY + L.chromeH / 2;
        ["#E9695F", "#E5B23C", "#5FC65A"].forEach((c, i) => {
          ctx.fillStyle = c;
          ctx.beginPath();
          ctx.arc(winX + (18 + i * 20) * L.s, dy, dot, 0, Math.PI * 2);
          ctx.fill();
        });

        // the real URL of the deployed app — never a dressed-up one
        if (opts.url) {
          const pillW = Math.min(winW * 0.52, 520 * L.s);
          const pillH = 24 * L.s;
          const px = winX + winW / 2 - pillW / 2;
          const py = dy - pillH / 2;
          ctx.fillStyle = "rgba(26,21,18,0.06)";
          roundRect(ctx, px, py, pillW, pillH, pillH / 2);
          ctx.fill();
          ctx.fillStyle = MUTED;
          ctx.font = `${12 * L.s}px "IBM Plex Mono", ui-monospace, monospace`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(opts.url, winX + winW / 2, dy + 0.5 * L.s);
          ctx.textAlign = "left";
        }

        // the product still
        const im = images.get(shot);
        if (im) {
          ctx.imageSmoothingQuality = "high";
          ctx.drawImage(im, winX, L.y, L.contentW, L.contentH);
        } else {
          ctx.fillStyle = PAPER;
          ctx.fillRect(winX, L.y, L.contentW, L.contentH);
        }
        ctx.restore();

        // hairline edge
        ctx.save();
        ctx.strokeStyle = "rgba(255,255,255,0.10)";
        ctx.lineWidth = Math.max(1, L.s * 0.8);
        roundRect(ctx, winX, winY, winW, winH, radius);
        ctx.stroke();
        ctx.restore();

        return L;
      }

      // ── cursor (disclosed presentation cursor) ───────────────────────────
      function drawCursor(x, y, L, scale = 1, press = 0) {
        const px = L.x + x * L.s;
        const py = L.y + y * L.s;
        const k = 26 * scale * clamp(L.s, 0.8, 1.6);

        if (press > 0) {
          ctx.save();
          ctx.globalAlpha = 0.35 * (1 - press);
          ctx.strokeStyle = VERMILION;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(px, py, 10 + press * 54, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        ctx.save();
        ctx.translate(px, py);
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 3;
        // a plain arrow, drawn large enough to read at 1080p
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, k);
        ctx.lineTo(k * 0.26, k * 0.76);
        ctx.lineTo(k * 0.42, k * 1.08);
        ctx.lineTo(k * 0.56, k * 1.02);
        ctx.lineTo(k * 0.4, k * 0.7);
        ctx.lineTo(k * 0.72, k * 0.68);
        ctx.closePath();
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = "rgba(20,16,12,0.85)";
        ctx.stroke();
        ctx.restore();
      }

      // ── type ─────────────────────────────────────────────────────────────
      function wrap(text, font, maxW) {
        ctx.font = font;
        const words = String(text).split(/\s+/);
        const lines = [];
        let line = "";
        for (const w of words) {
          const probe = line ? `${line} ${w}` : w;
          if (ctx.measureText(probe).width > maxW && line) {
            lines.push(line);
            line = w;
          } else line = probe;
        }
        if (line) lines.push(line);
        return lines;
      }

      /** Lower-third caption: a claim the voice is making, set in the product's own faces. */
      function drawCaption(text, alpha, opts = {}) {
        if (alpha <= 0.001) return;
        const maxW = W * 0.62;
        const font = `500 ${opts.size || 40}px Newsreader, Georgia, serif`;
        const lines = wrap(text, font, maxW);
        const lh = (opts.size || 40) * 1.28;
        const padX = 34;
        const padY = 24;
        const boxW = Math.min(maxW + padX * 2, Math.max(...lines.map((l) => ctx.measureText(l).width)) + padX * 2);
        const boxH = lines.length * lh + padY * 2 - (lh - (opts.size || 40)) * 0.4;
        const x = opts.x ?? 96;
        const y = opts.y ?? H - boxH - 92;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(0, (1 - alpha) * 14); // a small rise as it fades in
        ctx.shadowColor = "rgba(0,0,0,0.45)";
        ctx.shadowBlur = 40;
        ctx.shadowOffsetY = 12;
        ctx.fillStyle = PAPER;
        roundRect(ctx, x, y, boxW, boxH, 4);
        ctx.fill();
        ctx.shadowColor = "transparent";
        ctx.fillStyle = VERMILION;
        ctx.fillRect(x, y, 4, boxH);
        ctx.fillStyle = INK;
        ctx.font = font;
        ctx.textBaseline = "top";
        lines.forEach((l, i) => ctx.fillText(l, x + padX, y + padY + i * lh));
        ctx.restore();
      }

      /** The disclosure strip. Small, permanent while the cursor is on screen. */
      function drawDisclosure(text, alpha) {
        if (alpha <= 0.001) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.font = '500 17px "IBM Plex Mono", ui-monospace, monospace';
        const w = ctx.measureText(text).width;
        const x = W - w - 52;
        const y = H - 46;
        // Solid, not a wash: a disclosure that cannot be read is not a disclosure.
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 18;
        ctx.fillStyle = "rgba(14,11,9,0.92)";
        roundRect(ctx, x - 16, y - 21, w + 32, 36, 3);
        ctx.fill();
        ctx.shadowColor = "transparent";
        ctx.strokeStyle = "rgba(200,52,6,0.9)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x - 16, y - 21);
        ctx.lineTo(x - 16, y + 15);
        ctx.stroke();
        ctx.fillStyle = "#F7F3EB";
        ctx.textBaseline = "middle";
        ctx.fillText(text, x, y - 3);
        ctx.restore();
      }

      // ── evidence panel (the refusal) ─────────────────────────────────────
      function drawEvidence(ev, alpha, reveal) {
        if (alpha <= 0.001) return;
        const pad = 46;
        const x = W * 0.09;
        const w = W * 0.82;
        // Height follows the content — a panel with a third of it empty reads as a mistake.
        const noteLines = wrap(ev.note, '16px "IBM Plex Mono", ui-monospace, monospace', w - pad * 2).length;
        const h =
          34 + 32 + noteLines * 22 + 26 + 26 + 24 + ev.request.length * 24 + 16 + 26 +
          ev.response.reduce((a, l) => a + (l.startsWith("  ") ? 26 : 32), 0) + 30;
        const y = (H - h) / 2;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.shadowColor = "rgba(0,0,0,0.6)";
        ctx.shadowBlur = 70;
        ctx.shadowOffsetY = 22;
        ctx.fillStyle = PAPER;
        roundRect(ctx, x, y, w, h, 6);
        ctx.fill();
        ctx.shadowColor = "transparent";

        // the label that makes this panel honest
        ctx.fillStyle = VERMILION;
        ctx.fillRect(x, y, w, 7);
        ctx.fillStyle = INK;
        ctx.font = '500 20px "IBM Plex Mono", ui-monospace, monospace';
        ctx.textBaseline = "top";
        ctx.fillText("LIVE API RESPONSE — NOT A SCREEN RECORDING", x + pad, y + 34);
        ctx.fillStyle = MUTED;
        ctx.font = '16px "IBM Plex Mono", ui-monospace, monospace';
        const note = wrap(ev.note, '16px "IBM Plex Mono", ui-monospace, monospace', w - pad * 2);
        note.forEach((l, i) => ctx.fillText(l, x + pad, y + 66 + i * 22));

        let cy = y + 66 + note.length * 22 + 26;
        ctx.strokeStyle = "rgba(26,21,18,0.18)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + pad, cy);
        ctx.lineTo(x + w - pad, cy);
        ctx.stroke();
        cy += 26;

        // request
        ctx.fillStyle = MUTED;
        ctx.font = '500 15px "IBM Plex Mono", ui-monospace, monospace';
        ctx.fillText("REQUEST", x + pad, cy);
        cy += 24;
        ctx.fillStyle = INK;
        ctx.font = '17px "IBM Plex Mono", ui-monospace, monospace';
        for (const line of ev.request) {
          ctx.fillText(line, x + pad, cy);
          cy += 24;
        }

        cy += 16;
        ctx.fillStyle = MUTED;
        ctx.font = '500 15px "IBM Plex Mono", ui-monospace, monospace';
        ctx.fillText("RESPONSE", x + pad, cy);
        cy += 26;

        // the refusal headline, revealed with the voice
        const shown = Math.floor(reveal * ev.response.length);
        ctx.font = '18px "IBM Plex Mono", ui-monospace, monospace';
        for (let i = 0; i < ev.response.length; i++) {
          const line = ev.response[i];
          const a = clamp(reveal * ev.response.length - i, 0, 1);
          if (a <= 0) break;
          ctx.globalAlpha = alpha * a;
          ctx.fillStyle = line.startsWith("  ") ? INK : VERMILION;
          ctx.font = line.startsWith("  ")
            ? '18px "IBM Plex Mono", ui-monospace, monospace'
            : '500 22px "IBM Plex Mono", ui-monospace, monospace';
          ctx.fillText(line, x + pad, cy);
          cy += line.startsWith("  ") ? 26 : 32;
        }
        ctx.restore();
      }

      // ── title / closing cards ────────────────────────────────────────────
      function drawCard(card, alpha, t) {
        if (alpha <= 0.001) return;
        ctx.save();
        ctx.globalAlpha = alpha;

        // the misregistration motif: three issuer inks sliding into register
        const reg = EASE.camera(clamp((t - (card.regAt ?? 0.6)) / 1.6, 0, 1));
        const bars = [
          { c: INKS.ondo, off: 92 },
          { c: INKS.xstocks, off: -64 },
          { c: INKS.backpack, off: 44 },
        ];
        const barW = 520;
        const barH = 26;
        const bx = W / 2 - barW / 2;
        const by = card.qr ? H * 0.17 : H * 0.26;
        ctx.globalCompositeOperation = "screen";
        bars.forEach((b, i) => {
          ctx.fillStyle = b.c;
          ctx.globalAlpha = alpha * 0.85;
          ctx.fillRect(bx + b.off * (1 - reg), by + i * (barH + 12), barW, barH);
        });
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = alpha;

        const titleY = card.qr ? H * 0.46 : H * 0.58;
        ctx.textAlign = "center";
        ctx.fillStyle = PAPER;
        ctx.font = '400 92px "Instrument Serif", Newsreader, Georgia, serif';
        ctx.textBaseline = "alphabetic";
        ctx.fillText(card.title, W / 2, titleY);
        if (card.sub) {
          ctx.fillStyle = VERMILION;
          ctx.font = "italic 400 44px Newsreader, Georgia, serif";
          ctx.fillText(card.sub, W / 2, titleY + 66);
        }
        if (card.foot) {
          ctx.fillStyle = "rgba(247,243,235,0.66)";
          ctx.font = '400 24px "IBM Plex Mono", ui-monospace, monospace';
          ctx.fillText(card.foot, W / 2, titleY + (card.qr ? 116 : 130));
        }

        // a real, scannable link to the live app
        const qr = card.qr && images.get("__qr");
        if (qr) {
          const size = 188;
          const qx = W / 2 - size / 2;
          const qy = titleY + 154;
          const pad = 14;
          ctx.fillStyle = PAPER;
          roundRect(ctx, qx - pad, qy - pad, size + pad * 2, size + pad * 2, 4);
          ctx.fill();
          ctx.drawImage(qr, qx, qy, size, size);
          ctx.fillStyle = "rgba(247,243,235,0.5)";
          ctx.font = '400 17px "IBM Plex Mono", ui-monospace, monospace';
          ctx.fillText("scan to open it live", W / 2, qy + size + 40);
        }
        ctx.textAlign = "left";
        ctx.restore();
      }

      // ── timeline evaluation ──────────────────────────────────────────────
      function valueAt(keys, t, ease = EASE.camera) {
        if (!keys || !keys.length) return null;
        if (t <= keys[0].at) return keys[0];
        for (let i = 0; i < keys.length - 1; i++) {
          const a = keys[i];
          const b = keys[i + 1];
          if (t >= a.at && t <= b.at) {
            const raw = b.at === a.at ? 1 : (t - a.at) / (b.at - a.at);
            const e = (EASE[b.ease] || ease)(raw);
            const out = {};
            for (const k of Object.keys(a)) {
              if (typeof a[k] === "number" && typeof b[k] === "number") out[k] = lerp(a[k], b[k], e);
              else out[k] = b[k];
            }
            return out;
          }
        }
        return keys[keys.length - 1];
      }

      function shotAt(t) {
        for (const s of film.shots) if (t >= s.start && t < s.start + s.duration) return s;
        return film.shots[film.shots.length - 1];
      }

      /** Draw the whole frame at time `t`. Pure: same `t` always gives the same pixels. */
      function seek(t) {
        const s = shotAt(t);
        const local = t - s.start;
        drawBackground(t);

        if (s.kind === "card") {
          drawCard(s.card, fade(s, local), local);
        } else {
          const cam = valueAt(s.camera, local) || { cx: VIEW_W / 2, cy: VIEW_H / 2, zoom: 1 };
          const L = drawWindow(s.shot, cam, { url: s.url || film.url });

          if (s.cursor && s.cursor.length) {
            const c = valueAt(s.cursor, local, EASE.soft);
            let press = 0;
            for (const p of s.cursor) {
              if (p.click && local >= p.at && local < p.at + 0.6) press = (local - p.at) / 0.6;
            }
            drawCursor(c.x, c.y, L, c.scale ?? 1, press);
            drawDisclosure("presentation cursor — added in edit", clamp((local - 0.2) * 2, 0, 1));
          }

          if (s.evidence) {
            const a = clamp((local - s.evidence.at) * 1.6, 0, 1);
            const reveal = clamp((local - s.evidence.at - 0.6) / (s.evidence.over || 3), 0, 1);
            drawEvidence(film.evidence, a, reveal);
          }
        }

        // captions sit above everything, in screen space
        if (s.captions) {
          for (const c of s.captions) {
            const a = Math.min(clamp((local - c.at) * 2.4, 0, 1), clamp((c.until - local) * 2.4, 0, 1));
            drawCaption(c.text, a, c);
          }
        }

        // global fade from/to black at the very ends
        const edge = Math.min(clamp(t / 0.9, 0, 1), clamp((film.duration - t) / 1.1, 0, 1));
        if (edge < 1) {
          ctx.fillStyle = `rgba(0,0,0,${1 - edge})`;
          ctx.fillRect(0, 0, W, H);
        }
      }

      function fade(s, local) {
        return Math.min(clamp(local / 0.5, 0, 1), clamp((s.duration - local) / 0.5, 0, 1));
      }

      // ── public API for the encoder ───────────────────────────────────────
      window.studio = {
        async load(spec) {
          film = spec;
          buildBackground();
          const sources = [...new Set(spec.shots.filter((s) => s.shot).map((s) => s.shot))].map((n) => [
            n,
            `../src/${n}.png`,
          ]);
          const qrCard = spec.shots.find((s) => s.card?.qr);
          if (qrCard) sources.push(["__qr", qrCard.card.qr.image]);
          await Promise.all(
            sources.map(
              ([name, src]) =>
                new Promise((res, rej) => {
                  const im = new Image();
                  im.onload = () => {
                    images.set(name, im);
                    res();
                  };
                  im.onerror = () => rej(new Error("missing image: " + name));
                  im.src = src;
                }),
            ),
          );
          // the product's faces, so captions match the app
          if (document.fonts) {
            await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 4000))]);
          }
          return { shots: spec.shots.length, images: images.size, duration: spec.duration };
        },
        seek,
        canvas: cv,
        get duration() {
          return film?.duration ?? 0;
        },
      };
    </script>
  </body>
</html>
