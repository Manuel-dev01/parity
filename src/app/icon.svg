<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The product's one idea at 16px: three issuer inks printed out of register,
       with the ink rule marking where fair value actually is. -->
  <rect width="32" height="32" fill="#F7F3EB" />
  <g style="mix-blend-mode:multiply">
    <rect x="7" y="6" width="19" height="5" fill="#F72FA7" />
    <rect x="4" y="13" width="19" height="5" fill="#FFDC3A" />
    <rect x="9" y="20" width="19" height="5" fill="#00C5EE" />
  </g>
  <rect x="15" y="3" width="2" height="26" fill="#1A1512" />
</svg>
