[package]
name = "fair_fill_guard"
version = "0.1.0"
description = "Parity: oracle-checked fill guard for tokenized stocks on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fair_fill_guard"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

# anchor-lang only. Solana Playground builds against a fixed crate list with no
# pyth-solana-receiver-sdk and no token_2022-featured anchor-spl, so the program reads the
# Pyth PriceUpdateV2 and SPL/Token-2022 account layouts directly (see src/lib.rs).
# 0.29.0 is Playground's Anchor version; ctx.bumps is a BTreeMap at this version.
[dependencies]
anchor-lang = "0.29.0"
