[package]
name = "fair_fill_guard"
version = "0.1.0"
description = "Parity: oracle-checked fill guard for tokenized stocks on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fair_fill_guard"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
# Version to confirm against docs.pyth.network on build day: the Aug-2026 "Pyth Core"
# upgrade changed the crate's feature flags.
pyth-solana-receiver-sdk = "0.6"
